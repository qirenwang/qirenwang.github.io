<div id="clustrmaps-widget" style="text-align:center;">
  <script>
    function clustrmapsHasOutput() {
      return document.querySelector(
        "#clustrmaps-widget img, #clustrmaps-widget iframe, #clustrmaps-widget canvas, #clustrmaps-widget object, #clustrmaps-widget svg, #clustrmaps-widget a[href*='clustrmaps']"
      );
    }

    window.clustrmapsFailed = function () {
      var fallback = document.getElementById("clustrmaps-fallback");
      if (fallback) {
        fallback.style.display = "block";
      }
    };

    window.setTimeout(function () {
      if (!clustrmapsHasOutput()) {
        window.clustrmapsFailed();
      }
    }, 5000);
  </script>
  <script
    type="text/javascript"
    id="clustrmaps"
    src="https://clustrmaps.com/map_v2.js?d=XfNj1V1ObUKxL0p2QldZmz3da_t2lX5f1q6wW-zen1E&cl=ffffff&w=a"
    onerror="window.clustrmapsFailed()">
  </script>
  <p id="clustrmaps-fallback" style="display:none;text-align:center;font-size:0.9em;color:#7a8288;">
    Visitor map is temporarily unavailable because the external ClustrMaps widget could not be loaded.
  </p>
  <noscript>
    <p style="text-align:center;font-size:0.9em;color:#7a8288;">
      Visitor map requires JavaScript to load.
    </p>
  </noscript>
</div>
