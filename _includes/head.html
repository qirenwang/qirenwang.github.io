{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function () {
    var storageKey = 'qirenwang-theme-preference';
    var legacyStorageKey = 'qirenwang-theme';
    var storedTheme = null;
    var systemTheme = 'light';

    try {
      window.localStorage.removeItem(legacyStorageKey);
      storedTheme = window.localStorage.getItem(storageKey);
    } catch (error) {}

    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      systemTheme = 'dark';
    }

    if (storedTheme !== 'light' && storedTheme !== 'dark') {
      storedTheme = null;
    }

    document.documentElement.setAttribute('data-theme', storedTheme || systemTheme);
  })();
</script>

<!-- For all browsers -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
